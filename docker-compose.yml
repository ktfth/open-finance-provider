services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "OpenFinance@123"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "OpenFinance@123" -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - openfinance

  consent-service:
    build:
      context: .
      dockerfile: src/OpenFinance.ConsentService/Dockerfile
    environment:
      ConnectionStrings__ConsentDb: "Server=sqlserver;Database=OpenFinanceConsent;User Id=sa;Password=OpenFinance@123;TrustServerCertificate=True;"
      Authentication__SigningKey: "DevOnlySigningKey-AtLeast32Characters-ChangeInProduction!"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - openfinance

  account-service:
    build:
      context: .
      dockerfile: src/OpenFinance.AccountService/Dockerfile
    environment:
      ConnectionStrings__AccountDb: "Server=sqlserver;Database=OpenFinanceAccount;User Id=sa;Password=OpenFinance@123;TrustServerCertificate=True;"
      ConsentService__BaseUrl: "http://consent-service:8080"
      Authentication__SigningKey: "DevOnlySigningKey-AtLeast32Characters-ChangeInProduction!"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5002:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      consent-service:
        condition: service_started
    networks:
      - openfinance

  payment-service:
