services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "OpenFinance@123"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "OpenFinance@123" -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  consent-service:
    build:
      context: .
      dockerfile: src/OpenFinance.ConsentService/Dockerfile
    environment:
      ConnectionStrings__ConsentDb: "Server=sqlserver;Database=OpenFinanceConsent;User Id=sa;Password=OpenFinance@123;TrustServerCertificate=True;"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  account-service:
    build:
      context: .
      dockerfile: src/OpenFinance.AccountService/Dockerfile
    environment:
      ConnectionStrings__AccountDb: "Server=sqlserver;Database=OpenFinanceAccount;User Id=sa;Password=OpenFinance@123;TrustServerCertificate=True;"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5002:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: src/OpenFinance.PaymentService/Dockerfile
    environment:
      ConnectionStrings__PaymentDb: "Server=sqlserver;Database=OpenFinancePayment;User Id=sa;Password=OpenFinance@123;TrustServerCertificate=True;"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5003:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqldata:
